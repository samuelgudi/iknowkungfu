[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iknowkungfu"
version = "0.1.7"
description = "Agent-agnostic registry for skill discovery and contribution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samuel Gudi", email = "samuel.gudi.official@gmail.com" }]
dependencies = [
  "jsonschema>=4.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]

[project.scripts]
kfu = "agent_skills.cli:main"
iknowkungfu-mcp = "agent_skills.mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_skills*", "adapters*", "clients*"]
